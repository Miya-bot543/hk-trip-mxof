<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>北海道 10 日遊｜已搬到正式網址</title>
<meta http-equiv="refresh" content="2;url=../">
<script>
/* /v2/ 已搬到正式網址：解除舊的 /v2/ 離線功能後轉過去，保留 #/章節 */
(function(){
  var go = function(){ location.replace("../" + location.hash); };
  var t = setTimeout(go, 1500);
  if (!("serviceWorker" in navigator)) { clearTimeout(t); go(); return; }
  navigator.serviceWorker.getRegistrations().then(function(rs){
    return Promise.all(rs.filter(function(r){ return /\/v2\/$/.test(r.scope); }).map(function(r){ return r.unregister(); }));
  }).catch(function(){}).then(function(){ clearTimeout(t); go(); });
})();
</script>

</head>
<body>
<p>網站已搬到正式網址，正在帶你過去…<br><a href="../">沒有自動跳轉請點這裡</a></p>
</body>
</html>
